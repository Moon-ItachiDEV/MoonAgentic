<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3b0ff"/><stop offset="0.5" stop-color="#6478ee"/><stop offset="1" stop-color="#3343bf"/></linearGradient>
  <radialGradient id="sheen" cx="512" cy="-120" r="760" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sun" cx="616" cy="268" r="266.6" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#f1f1f4"/><stop offset="1" stop-color="#c3c6d6"/>
  </radialGradient>
  <radialGradient id="sunRim" cx="680" cy="340" r="172" gradientUnits="userSpaceOnUse">
    <stop offset=".82" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.4"/>
  </radialGradient>
  <linearGradient id="sunRimDir" x1="508" y1="168" x2="852" y2="512" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/>
  </linearGradient>
  <mask id="sunRimMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><circle cx="680" cy="340" r="172" fill="url(#sunRim)"/></mask>
  <radialGradient id="halo" cx="680" cy="340" r="361.2" gradientUnits="userSpaceOnUse">
    <stop offset=".38" stop-color="#f1f1f4" stop-opacity="0.3"/><stop offset="1" stop-color="#f1f1f4" stop-opacity="0"/>
  </radialGradient>
  <mask id="cres" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000"/>
    <circle cx="445" cy="585" r="290" fill="#fff"/>
    <circle cx="282" cy="462" r="228" fill="#000"/>
  </mask>
  <mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000"/>
    <g mask="url(#cres)"><rect width="1024" height="1024" fill="#fff"/></g>
    <circle cx="445" cy="585" r="287" fill="#000"/>
    <circle cx="282" cy="462" r="231" fill="#fff" opacity="0"/>
  </mask>
  <mask id="edgei" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000"/>
    <g mask="url(#cres)"><circle cx="282" cy="462" r="231" fill="#fff"/></g>
  </mask>
  <mask id="band" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000"/>
    <g mask="url(#cres)"><rect width="1024" height="1024" fill="#fff"/></g>
    <circle cx="445" cy="585" r="264" fill="#000"/>
    <circle cx="282" cy="462" r="254" fill="#fff" opacity="0"/>
  </mask>
  <mask id="bandi" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000"/>
    <g mask="url(#cres)"><circle cx="282" cy="462" r="254" fill="#fff"/></g>
  </mask>
  <linearGradient id="glass" x1="155" y1="295" x2="619" y2="875" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset=".55" stop-color="#e8ebff" stop-opacity="0.38"/><stop offset="1" stop-color="#e8ebff" stop-opacity="0.24"/>
  </linearGradient>
  <linearGradient id="light" x1="735" y1="295" x2="155" y2="875" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".45" stop-color="#fff" stop-opacity=".2"/><stop offset=".8" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
  </linearGradient>
  <linearGradient id="shade" x1="0" y1="585" x2="0" y2="875" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1a2390" stop-opacity="0"/><stop offset="1" stop-color="#1a2390" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="frost" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1424" height="1424"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="hair" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><feGaussianBlur stdDeviation=".8"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#sheen)"/>

<!-- back layer: the sphere -->
<circle cx="680" cy="340" r="361.2" fill="url(#halo)"/>
<circle cx="680" cy="340" r="172" fill="url(#sun)"/>
<rect width="1024" height="1024" fill="url(#sunRimDir)" mask="url(#sunRimMask)"/>

<!-- front layer: the glass moon -->
<g transform="translate(8 34)" opacity="0.4"><g mask="url(#cres)"><rect width="1024" height="1024" fill="#1a2390" filter="url(#shadow)"/></g></g>
<g mask="url(#cres)">
  <g filter="url(#frost)">
    <rect x="-200" y="-200" width="1424" height="1424" fill="url(#bg)"/>
    <circle cx="680" cy="340" r="361.2" fill="url(#halo)"/>
    <!-- refraction: the sphere seen a little bigger and shifted through the thick glass -->
    <circle cx="662" cy="354" r="185.76000000000002" fill="url(#sun)"/>
  </g>
  <rect width="1024" height="1024" fill="url(#glass)"/>
  <rect width="1024" height="1024" fill="url(#shade)"/>
</g>
<!-- thick-glass edge: a soft lit band, then a hairline -->
<rect width="1024" height="1024" fill="url(#light)" opacity="0.8" mask="url(#band)" filter="url(#soft)"/>
<rect width="1024" height="1024" fill="url(#light)" opacity="0.48" mask="url(#bandi)" filter="url(#soft)"/>
<rect width="1024" height="1024" fill="url(#light)" mask="url(#edge)" filter="url(#hair)"/>
<rect width="1024" height="1024" fill="url(#light)" opacity=".8" mask="url(#edgei)" filter="url(#hair)"/>
</svg>