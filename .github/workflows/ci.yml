name: CI

# MoonAgentic CI: lint, typecheck and tests on GitHub-hosted runners. The upstream t3code
# workflows ran on Blacksmith runners with t3code secrets, which this fork does not have.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Format
        run: vp fmt --check
      - name: Lint
        run: vp lint --report-unused-disable-directives
      - name: Check unused code
        run: vp run knip:check
      - name: Check i18n catalogs
        run: vp run i18n:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-ci-deps
      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Typecheck
        run: vp run typecheck

  test:
    name: Test (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Web browser tests crash Chromium on a 16 GB runner when run as one suite.
        include:
          - suite: packages
          - { suite: web, shard: 1/3 }
          - { suite: web, shard: 2/3 }
          - { suite: web, shard: 3/3 }
          - suite: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The desktop tests compile the browser secret helper.
      - name: Install browser secret helper build libraries
        if: matrix.suite == 'packages'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - uses: ./.github/actions/setup-ci-deps
      - name: Ensure Electron runtime is installed
        if: matrix.suite == 'packages'
        run: vp run --filter @t3tools/desktop ensure:electron
      - name: Install Chromium
        if: matrix.suite == 'web'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Install Chromium
        if: matrix.suite == 'server'
        run: node apps/server/node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      # GitHub runners have 4 vCPUs; four suites at once starved the ssh launcher tests
      # (a 30s real-shell spawn timed out), so packages run two at a time.
      - name: Test
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SUITE" in
            packages) vp run --parallel --concurrency-limit 2 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test ;;
            web) vp run --filter @t3tools/web test --shard "$SHARD" ;;
            server) vp run --filter t3 test ;;
          esac
