name: CI

on:
  pull_request:
  push:
    branches: [main]

# The checks read the repository and write nothing: a pull request's code runs here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_FAILURES: e2e-failures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-failures-linux
          path: e2e-failures
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each test file starts agents and git processes of its own: three files at once on the
      # 4-core runner held every one of them up to a minute (main, 2026-11-27, 5 tests red).
      - run: pnpm test --maxWorkers=2

  # The app runs on the user's Windows computers: the browser checks run there too, against the
  # real server, its agents' processes, git and the stand-in command-line tools.
  windows-e2e:
    name: Navigateur (Windows)
    runs-on: windows-latest
    # DIAG (temporaire) : trois passes, le test du téléphone répété dix fois dans chacune.
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      # Two files at a time, each with its own server and browser: three at once on the
      # runner's four cores made a team's turn twice as long as on Linux, past the tests' waits.
      - run: pnpm e2e --maxWorkers=2
        env:
          E2E_FAILURES: e2e-failures
          DIAG_REPEATS: 10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-failures-windows-${{ matrix.attempt }}
          path: e2e-failures
          if-no-files-found: ignore
          retention-days: 7
