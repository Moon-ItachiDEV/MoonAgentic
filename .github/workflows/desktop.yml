name: Desktop

# Builds the desktop installers: on a pull request that touches the app, to try them (kept 7
# days in the run's artifacts); on a `v*` tag, attached to that tag's GitHub Release. The
# installers never publish themselves: two jobs creating the release at once made two
# releases for v0.1.0. The `release` job creates it once (or fills the one made on GitHub),
# with both files and their SHA-256 in SHA256SUMS.txt, which the desktop app checks before
# installing an update.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

# Read only by default: the installer jobs run the packages' own scripts (pnpm install,
# electron-builder), which must not get a token able to change the repository or its releases.
permissions:
  contents: read

jobs:
  installer:
    name: Installeur (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: apps/desktop/release/*.exe
          - name: Mac
            os: macos-latest
            target: --mac
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @moonagentic/desktop compile
      - run: pnpm --filter @moonagentic/desktop stage
      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid certificate: nothing to look for in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MoonAgentic-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Release
    # Windows is what the self-update needs: a Mac build that never gets a runner (it was
    # cancelled after 15 min waiting, for v0.1.6) must not hold the Windows installer back.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    needs: installer
    runs-on: ubuntu-latest
    # The one job that writes: it creates the release and adds the installers to it. It checks
    # out nothing and runs no package's code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: installers
          merge-multiple: true
      # The desktop app downloads its update from the release and runs it only if its SHA-256
      # matches this list: an installer corrupted or swapped on the way is refused.
      - name: Fingerprint the installers
        working-directory: installers
        run: |
          shopt -s nullglob
          exe=(*.exe)
          if [ ${#exe[@]} -eq 0 ]; then echo "Pas d'installeur Windows : rien à publier."; exit 1; fi
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The tag is pushed with git, or made on GitHub with « Draft a new release » (handy from a
      # phone): then the release already exists and the files are added to it instead.
      - name: Create the release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
