name: Desktop

# Builds the desktop installers: on a pull request that touches the app, to try them (kept 7
# days in the run's artifacts); on a `v*` tag, attached to that tag's GitHub Release. The
# installers never publish themselves: two jobs creating the release at once made two
# releases for v0.1.0. The `release` job creates it once (or fills the one made on GitHub),
# with both files and their SHA-256 in SHA256SUMS.txt, which the desktop app checks before
# installing an update.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  installer:
    name: Installeur (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: apps/desktop/release/*.exe
          - name: Mac
            os: macos-latest
            target: --mac
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @moonagentic/desktop compile
      - run: pnpm --filter @moonagentic/desktop stage
      - name: Build the installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid certificate: nothing to look for in the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonAgentic-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # The desktop app downloads its update from the release and runs it only if its SHA-256
      # matches this list: an installer corrupted or swapped on the way is refused.
      - name: Fingerprint the installers
        working-directory: installers
        run: sha256sum -- *.exe *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      # The tag is pushed with git, or made on GitHub with « Draft a new release » (handy from a
      # phone): then the release already exists and the files are added to it instead.
      - name: Create the release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
